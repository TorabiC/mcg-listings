function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
var f=document.getElementById("f"),p=document.getElementById("p"),bt=document.getElementById("b"),er=document.getElementById("e");
async function open_(code,quiet){
  var norm=code.toUpperCase().replace(/[^A-Z0-9]/g,"");if(!norm)return false;
  bt.disabled=true;bt.textContent="Opening";
  try{
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
    var html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem("mcgEvCode",norm);}catch(e){}
    document.open();document.write(html);document.close();
    return true;
  }catch(e){
    bt.disabled=false;bt.textContent="Open Report";
    try{sessionStorage.removeItem("mcgEvCode");}catch(_){}
    if(!quiet){er.textContent=(window.crypto&&crypto.subtle)?"That code did not open the report. Check it and try again.":"This browser cannot open the report. Please use a current version of Safari, Chrome or Edge.";p.focus();p.select();}
    return false;
  }
}
